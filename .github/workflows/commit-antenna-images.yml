# One-shot: decode the text-encoded antenna diagrams and commit the WebP files
# to the default branch and to gh-pages (if it exists).
name: Commit antenna images

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-antenna-images
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode WebP images
        run: python3 scripts/decode-antenna-images.py

      - name: Commit images to main and gh-pages
        run: |
          set -euo pipefail
          IMAGES_DIR="$GITHUB_WORKSPACE/images"
          test -f "$IMAGES_DIR/horizon_on5ee.webp"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_to() {
            local branch="$1"
            local work
            work="$(mktemp -d)"
            git fetch origin "$branch"
            git worktree add --detach "$work" "origin/$branch"
            mkdir -p "$work/images"
            cp "$IMAGES_DIR"/*.webp "$work/images/"
            git -C "$work" add images/*.webp
            if git -C "$work" diff --staged --quiet; then
              echo "No change on $branch"
            else
              git -C "$work" commit -m "Ajout des diagrammes WebP de l'étude d'antenne EFHW"
              git -C "$work" push origin "HEAD:refs/heads/$branch"
              echo "Updated $branch"
            fi
            git worktree remove "$work" --force
          }

          DEFAULT_BRANCH="${GITHUB_REF_NAME}"
          commit_to "$DEFAULT_BRANCH"
          if [ "$(git ls-remote --heads origin gh-pages)" ] && [ "gh-pages" != "$DEFAULT_BRANCH" ]; then
            commit_to gh-pages
          fi
